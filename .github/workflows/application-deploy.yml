name: application-deploy
run-name: "deploy ${{ inputs.action || 'deploy' }} ${{ inputs.request_id || vars.IDP_REQUEST_ID }}"

on:
  workflow_run:
    workflows: [application-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        required: false
        default: ""
      action:
        description: deploy | uninstall
        required: false
        default: deploy

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: nixvarghese01/azure-backstage-goldenpath/.github/workflows/reusable-application-deploy.yml@develop
    permissions:
      contents: read
      id-token: write
    with:
      platform_ref: develop
      environment: dev
      action: ${{ inputs.action || 'deploy' }}
      release: orders-api
      namespace: orders-api
      image_tag: ${{ github.event.workflow_run.head_sha || github.sha }}
