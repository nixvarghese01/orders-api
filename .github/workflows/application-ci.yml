name: application-ci
run-name: "ci ${{ vars.IDP_REQUEST_ID }} ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: nixvarghese01/azure-backstage-goldenpath/.github/workflows/reusable-application-ci.yml@develop
    permissions:
      contents: read
      id-token: write          # push job: Azure federation and provenance signing
      actions: read            # CodeQL
      security-events: write   # CodeQL results
      attestations: write      # build provenance
    with:
      platform_ref: develop
      environment: dev
      image_name: orders-api
